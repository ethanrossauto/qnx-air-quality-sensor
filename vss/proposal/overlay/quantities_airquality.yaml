#
# Supplementary VSS quantity definition needed by ug/m^3 (mass concentration).
# Pass as an extra -q/--quantities file alongside spec/quantities.yaml.
# Follows the format of spec/quantities.yaml in the VSS repo.

mass-per-volume:
  definition: Mass of a constituent divided by the volume of the mixture (ISO 80000-9:2019)
  remark: Used for mass concentration of pollutants in air, e.g. particulate matter
          in micrograms per cubic meter.
