<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabin Air IVI</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b212c; --line:#232b38;
    --txt:#eef2f7; --dim:#8a95a6; --accent:#3ba7ff;
    --ok:#25c281; --warn:#f4b740; --alert:#ff4d4f;
    --state:var(--ok);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #16202e 0%, var(--bg) 55%);
    color:var(--txt); font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .wrap{height:100vh; display:flex; flex-direction:column; padding:22px 26px; gap:18px; max-width:1400px; margin:0 auto}

  /* top bar */
  .top{display:flex; align-items:center; gap:16px}
  .brand{display:flex; align-items:center; gap:12px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2b6cff,#31d0aa);display:grid;place-items:center}
  .brand h1{font-size:18px; letter-spacing:.16em; margin:0; font-weight:700}
  .brand small{display:block; color:var(--dim); letter-spacing:.14em; font-size:11px; margin-top:2px}
  .spacer{flex:1}
  /* data-source toggle (segmented): always shows DEMO vs LIVE. The LIVE segment turns
     green only when data is actually arriving, so it doubles as the connection light. */
  .modesw{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:100px; padding:3px}
  .modesw .seg{appearance:none; -webkit-appearance:none; border:none; cursor:pointer; font:inherit; font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--dim); background:transparent; padding:6px 15px; border-radius:100px; transition:background .2s,color .2s}
  #segDemo.on{background:color-mix(in srgb,var(--warn) 22%, transparent); color:var(--warn)}
  #segLive.on{background:color-mix(in srgb,var(--dim) 18%, transparent); color:var(--dim)}
  #segLive.on.connected{background:color-mix(in srgb,var(--ok) 20%, transparent); color:var(--ok)}
  .ghost:disabled{opacity:.38; cursor:not-allowed}
  .ghost:disabled:hover{border-color:var(--line)}
  .src{color:var(--txt); font-variant:small-caps; letter-spacing:.06em}
  .host{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 8px}
  .host input{background:transparent; border:none; color:var(--txt); font-size:13px; width:130px; outline:none}
  .host button, .ghost{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer}
  .host button:hover,.ghost:hover{border-color:var(--accent)}

  /* main grid */
  .grid{flex:1; display:grid; grid-template-columns:1.5fr 1fr; gap:18px; min-height:0}

  /* hero tile */
  .hero{position:relative; background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:22px; padding:26px 30px; display:flex; flex-direction:column; overflow:hidden}
  .hero::before{content:""; position:absolute; inset:0; background:radial-gradient(600px 300px at 80% -20%, color-mix(in srgb,var(--state) 26%, transparent), transparent 70%); transition:background .6s}
  .hero .label{color:var(--dim); letter-spacing:.14em; font-size:13px; text-transform:uppercase; z-index:1}
  .gaugewrap{flex:1; display:flex; align-items:center; justify-content:center; gap:34px; z-index:1}
  .gauge{position:relative; width:260px; height:260px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .val{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .gauge .num{font-size:76px; font-weight:800; line-height:1; color:var(--state); transition:color .5s; font-variant-numeric:tabular-nums}
  .gauge .unit{color:var(--dim); font-size:14px; margin-top:8px; letter-spacing:.05em}
  .statuspill{align-self:flex-start; z-index:1; display:inline-flex; align-items:center; gap:9px; padding:9px 16px; border-radius:100px; font-weight:700; letter-spacing:.1em; font-size:14px;
    color:var(--state); background:color-mix(in srgb,var(--state) 16%, transparent); border:1px solid color-mix(in srgb,var(--state) 40%, transparent)}
  .readout{z-index:1}
  .readout .big{font-size:15px; color:var(--dim)}

  /* side metrics */
  .side{display:grid; grid-template-rows:repeat(2,1fr); grid-template-columns:1fr 1fr; gap:16px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 20px; display:flex; flex-direction:column; justify-content:flex-start; gap:12px}
  .card .k{color:var(--dim); font-size:13px; letter-spacing:.08em; text-transform:uppercase}
  .card .v{font-size:38px; font-weight:700; font-variant-numeric:tabular-nums}
  .card .v small{font-size:16px; color:var(--dim); font-weight:500; margin-left:4px}

  /* alert banners (stacked: CO2 on top, filter below) */
  .alertstack{position:fixed; left:0; right:0; bottom:22px; margin:0 auto; max-width:1180px; padding:0 26px;
    display:flex; flex-direction:column; gap:12px; z-index:5; pointer-events:none}
  .alertcard{pointer-events:auto; display:none; align-items:center; gap:18px; background:linear-gradient(180deg,#2a0f10,#1c0b0c); border:1px solid #7a2b2d; border-left:6px solid var(--alert);
    border-radius:16px; padding:18px 22px; box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .alertcard.show{display:flex; animation:slideUp .45s cubic-bezier(.2,.9,.2,1)}
  @keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
  .alertcard .ico{width:46px;height:46px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--alert) 20%, transparent);display:grid;place-items:center}
  .alertcard .txt{flex:1}
  .alertcard .txt b{display:block; color:#ffd7d7; letter-spacing:.03em; font-size:16px}
  .alertcard .txt span{color:#e8a9aa; font-size:14px}
  /* CO2 banner: teal/blue tone so it reads as a distinct alert from the red filter one */
  .alertcard.co2{background:linear-gradient(180deg,#0d2230,#0b1620); border-color:#1f5a6e; border-left-color:var(--accent)}
  .alertcard.co2 .ico{background:color-mix(in srgb,var(--accent) 20%, transparent)}
  .alertcard.co2 .txt b{color:#d6ecff}
  .alertcard.co2 .txt span{color:#9fc6e6}

  .demozone{display:flex; gap:8px; align-items:center}
  .waiting{z-index:1; color:var(--dim); font-size:15px}
  @media (max-width:900px){ .grid{grid-template-columns:1fr} .gauge{width:210px;height:210px} .gauge .num{font-size:60px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 15c2-5 5-8 8-8s6 3 8 8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16" r="2" fill="#fff"/></svg>
      </div>
      <div><h1>CABIN AIR</h1><small>QNX SENSOR FRAMEWORK</small></div>
    </div>
    <div class="spacer"></div>
    <div class="modesw" id="modesw" title="Data source">
      <button class="seg" id="segDemo" type="button">DEMO</button>
      <button class="seg on" id="segLive" type="button">LIVE</button>
    </div>
    <div class="src" id="src">cabin_aq · —</div>
    <div class="host">
      <span style="color:var(--dim);font-size:12px">Pi</span>
      <input id="host" spellcheck="false">
      <button id="connect">Connect</button>
    </div>
    <div class="demozone"><button class="ghost" id="pollutebtn">Pollute ▲</button><button class="ghost" id="co2btn">CO2 ▲</button></div>
  </div>

  <div class="grid">
    <div class="hero">
      <div class="label">Cabin particulate · PM2.5</div>
      <div class="gaugewrap">
        <div class="gauge">
          <svg width="260" height="260" viewBox="0 0 260 260">
            <circle cx="130" cy="130" r="112" stroke="#232b38" stroke-width="18" fill="none"/>
            <circle id="arc" cx="130" cy="130" r="112" stroke="var(--state)" stroke-width="18" fill="none"
                    stroke-linecap="round" stroke-dasharray="703" stroke-dashoffset="703" style="transition:stroke-dashoffset .6s, stroke .5s"/>
          </svg>
          <div class="val"><div class="num" id="pm25">—</div><div class="unit">µg/m³</div></div>
        </div>
        <div class="readout">
          <div id="statuspill" class="statuspill"><span id="statustext">—</span></div>
          <p class="big" id="msg" style="margin-top:16px;max-width:230px">Waiting for cabin sensor…</p>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="card"><div class="k">Temperature</div><div class="v"><span id="temp">—</span><small>°C</small></div></div>
      <div class="card"><div class="k">Humidity</div><div class="v"><span id="rh">—</span><small>%RH</small></div></div>
      <div class="card"><div class="k">VOC index</div><div class="v" id="voc">—</div></div>
      <div class="card"><div class="k">Cabin CO2</div><div class="v"><span id="co2">—</span><small>ppm</small></div></div>
    </div>
  </div>
</div>

<div class="alertstack">
  <!-- 2nd alert: cabin CO2 buildup (occupants breathing on recirculation) -->
  <div class="alertcard co2" id="alertbar_co2">
    <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 13a4 4 0 004 4h9a3 3 0 000-6 5 5 0 00-9.6-1.4A3.5 3.5 0 004 13z" stroke="#8fd0ff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    <div class="txt"><b>Cabin CO2 high</b><span id="alertmsg_co2"></span></div>
  </div>
  <!-- cabin filter alert (PM2.5) -->
  <div class="alertcard" id="alertbar">
    <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 16H3L12 3z" stroke="#ff8f90" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4" stroke="#ff8f90" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="#ff8f90"/></svg></div>
    <div class="txt"><b id="alerttitle">Cabin air filter alert</b><span id="alertmsg"></span></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PORT = 8090;
  const STATE = { OK:'--ok', WARN:'--warn', ALERT:'--alert' };
  const STATECOL = { OK:'var(--ok)', WARN:'var(--warn)', ALERT:'var(--alert)' };
  // PM2.5 gauge scales 0..150 over the ring circumference (2*pi*112 ≈ 703)
  const CIRC = 703, PM_MAX = 150;

  let es = null, demoTimer = null, lastData = 0, demoPollute = false, demoCo2 = false, mode = 'live';

  function setState(status){
    const v = STATE[status] || '--ok';
    document.documentElement.style.setProperty('--state', `var(${v})`);
  }

  function render(d){
    lastData = Date.now();
    const pm = Number(d.pm2_5 ?? 0);
    const status = d.status || 'OK';
    setState(status);
    $('pm25').textContent = (d.status === 'INIT') ? '—' : pm;
    const off = CIRC - Math.min(pm, PM_MAX)/PM_MAX * CIRC;
    $('arc').style.strokeDashoffset = (d.status === 'INIT') ? CIRC : off;
    $('statustext').textContent = status;
    $('msg').textContent = d.message || '';
    $('temp').textContent = d.temp_c != null ? Number(d.temp_c).toFixed(1) : '—';
    $('rh').textContent   = d.rh_pct != null ? Number(d.rh_pct).toFixed(0) : '—';
    $('voc').textContent  = d.voc_index ?? '—';
    $('src').textContent  = `${d.source || 'cabin_aq'} · ${d.bus || '—'}`;

    // Cabin filter alert (PM2.5)
    const alert = d.alert === true || status === 'ALERT';
    $('alertbar').classList.toggle('show', alert);
    if (alert){ $('alertmsg').textContent = d.message || 'Service recommended.'; }

    // Cabin CO2-buildup alert (2nd)
    const co2status = d.co2_status || 'OK';
    const hasCo2 = d.co2_ppm != null && d.status !== 'INIT';
    $('co2').textContent = hasCo2 ? Number(d.co2_ppm) : '—';
    $('co2').style.color = hasCo2 ? (STATECOL[co2status] || '') : '';
    const co2alert = d.co2_alert === true || co2status === 'ALERT';
    $('alertbar_co2').classList.toggle('show', co2alert);
    if (co2alert){ $('alertmsg_co2').textContent = d.co2_message || 'Bring in fresh air.'; }
  }

  // The LIVE segment turns green only when real data is flowing, so it is the
  // connection indicator too. Only meaningful in live mode.
  function setConnected(connected){
    $('segLive').classList.toggle('connected', connected && mode === 'live');
  }

  function connect(){
    stopDemo();
    if (es){ es.close(); es = null; }
    const host = $('host').value.trim() || '192.168.1.10';
    localStorage.setItem('piHost', host);
    es = new EventSource(`http://${host}:${PORT}/stream`);
    es.onmessage = e => { try { render(JSON.parse(e.data)); setConnected(true); } catch(_){} };
    es.onerror = () => { setConnected(false); };  // EventSource auto-retries
  }

  // ---- demo simulator (no Pi needed) ----
  function stopDemo(){ if (demoTimer){ clearInterval(demoTimer); demoTimer = null; } }
  function startDemo(){
    if (es){ es.close(); es = null; }
    let pm = 8, co2 = 500;
    demoTimer = setInterval(() => {
      pm += demoPollute ? 7 : (pm > 8 ? -3 : (Math.random()*2-1));
      pm = Math.max(3, Math.min(150, pm));
      co2 += demoCo2 ? 90 : (co2 > 500 ? -40 : (Math.random()*10-5));
      co2 = Math.max(440, Math.min(3000, co2));
      const status = pm > 35 ? 'ALERT' : pm > 12 ? 'WARN' : 'OK';
      const msg = status==='ALERT' ? 'Cabin air filter no longer protecting occupants. Service recommended.'
                : status==='WARN' ? 'Cabin air quality degrading.' : 'Cabin air quality nominal.';
      const co2status = co2 > 1500 ? 'ALERT' : co2 > 1000 ? 'WARN' : 'OK';
      const co2msg = co2status==='ALERT' ? 'Cabin CO2 high. Bring in fresh air.'
                : co2status==='WARN' ? 'Cabin CO2 rising.' : 'Cabin CO2 nominal.';
      render({ pm2_5:Math.round(pm), temp_c:21.5+Math.random(), rh_pct:40+Math.random()*5,
               voc_index:Math.round(100+pm*2), aqi:Math.round(pm), status, alert:status==='ALERT',
               message:msg, co2_ppm:Math.round(co2), co2_status:co2status, co2_alert:co2status==='ALERT',
               co2_message:co2msg, source:'cabin_aq', bus:'demo' });
    }, 250);
  }

  // connection watchdog: if live and no data for 2.5s, drop the green
  setInterval(() => { if (mode === 'live' && Date.now()-lastData > 2500) setConnected(false); }, 1000);

  // Pollute / CO2 controls act on the local simulator, so they only apply in demo mode.
  function setPollute(on){ demoPollute = on; $('pollutebtn').textContent = on ? 'Clear ▼' : 'Pollute ▲'; }
  function setCo2(on){ demoCo2 = on; $('co2btn').textContent = on ? 'Clear ▼' : 'CO2 ▲'; }

  // DEMO = local simulator, LIVE = real Pi over SSE. The toggle is the single source of truth.
  function setMode(m){
    mode = m;
    const demoing = m === 'demo';
    $('segDemo').classList.toggle('on', demoing);
    $('segLive').classList.toggle('on', !demoing);
    $('pollutebtn').disabled = !demoing;   // greyed out in live mode
    $('co2btn').disabled = !demoing;
    setPollute(false); setCo2(false);
    if (demoing){ startDemo(); }
    else { $('segLive').classList.remove('connected'); connect(); }
  }

  $('segDemo').onclick = () => setMode('demo');
  $('segLive').onclick = () => setMode('live');
  $('connect').onclick = () => setMode('live');
  $('host').addEventListener('keydown', e => { if (e.key==='Enter') setMode('live'); });
  $('pollutebtn').onclick = () => { if (mode === 'demo') setPollute(!demoPollute); };
  $('co2btn').onclick = () => { if (mode === 'demo') setCo2(!demoCo2); };

  $('host').value = localStorage.getItem('piHost') || '192.168.1.10';
  setMode('live');
})();
</script>
</body>
</html>
